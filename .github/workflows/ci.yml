name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# docs/13 §7 pipeline: ruff -> mypy(core[, agent once it exists]) -> import-linter -> pytest
# with a coverage gate. All five gates must be green to merge (docs/20 §5).
jobs:
  quality-gates:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      # AGENTS.md scopes this to core + agent (per docs/ai/CODING_STANDARDS.md).
      - name: mypy (core, agent)
        run: uv run mypy src/nova/core src/nova/agent

      - name: import-linter
        run: uv run lint-imports

      # Iron rule (docs/13 §1): CI never calls paid/keyed APIs — `live`/`record`-marked
      # tests are excluded here; `record` tests regenerate golden fixtures manually.
      - name: pytest (unit + integration + ui, coverage gate on core+agent+providers >= 70%, NFR-11)
        run: >-
          uv run pytest -m "not live and not record"
          --cov=src/nova/core --cov=src/nova/agent --cov=src/nova/providers
          --cov-report=term-missing --cov-fail-under=70
