[project]
name = "nova-ai"
version = "0.1.0"
description = "A glass-walled AI assistant that shows you how it thinks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.7,<7",
    "google-genai>=1.0,<3",
    "groq>=0.20,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
    "simpleeval>=1.0,<2",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "import-linter>=2.0",
    # dev console pretty-printing only (TD-11) — never a packaged-build dependency;
    # core.logging import-guards it so production logging works without it.
    "rich>=13.7,<14",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova"]

# ── ruff (lint + format) ─────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "C4", "S102", "S307"]

[tool.ruff.lint.per-file-ignores]
# Qt overrides (paintEvent, mousePressEvent, ...) must match Qt's camelCase API.
"src/nova/ui/**" = ["N802"]
"tests/**" = ["S101"]

# ── mypy (strict zone: core, agent per AGENTS.md) ────────────────────
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "nova.core.*"
strict = true

# nova.providers.* deliberately stays out of the strict zone (CODING_STANDARDS.md,
# TD-12, AGENTS.md's verify command all agree: "core, agent" only) — it gets zero
# mypy checking, not permissive, which is consistent doc intent, not a gap.
[[tool.mypy.overrides]]
module = "nova.agent.*"
strict = true

# ── pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "live: requires real network/API keys; never run in CI",
    "record: regenerates golden fixtures; run manually with review",
]

[tool.coverage.run]
# docs/13 §2's "core, agent, tools, memory" enumeration omits providers, but the PRD's
# actual NFR-11 text just says "core logic" — providers hosts the most intricate new
# logic in M2 (fallback/cooldown state machine), so it's included here (flagged as a
# likely docs/13 §2 gap, not a deliberate exclusion, in docs/ai/MEMORY.md).
source = ["src/nova/core", "src/nova/agent", "src/nova/providers", "src/nova/tools"]

# ── import-linter (D-1...D-7, docs/03 §6) ────────────────────────────
# M1 scoped to core/ui/app.py. M2 adds providers/agent. A single `layers` contract
# cannot express "ui restricted to core-only, agent allowed core+providers" (layers
# grant every entry transitive access to everything below it as a block) — hence the
# second disjoint `layers` contract (ui deliberately absent from it) plus supplementary
# `forbidden` contracts closing both directions of the ui <-> agent/providers gap.
[tool.importlinter]
root_packages = ["nova"]

[[tool.importlinter.contracts]]
name = "M1 layering: app -> ui -> core (D-1, D-5, D-6, D-7)"
type = "layers"
layers = [
    "nova.app",
    "nova.ui",
    "nova.core",
]

[[tool.importlinter.contracts]]
name = "M2/M3 layering: app -> agent -> (providers | tools) -> core (D-1..D-4, D-6, D-7)"
type = "layers"
layers = [
    "nova.app",
    "nova.agent",
    "nova.providers : nova.tools",
    "nova.core",
]

[[tool.importlinter.contracts]]
name = "D-5: ui imports core only, never agent/providers"
type = "forbidden"
source_modules = ["nova.ui"]
forbidden_modules = ["nova.agent", "nova.providers", "nova.tools"]

[[tool.importlinter.contracts]]
name = "D-4 corollary: agent/providers/tools never import ui"
type = "forbidden"
source_modules = ["nova.agent", "nova.providers", "nova.tools"]
forbidden_modules = ["nova.ui"]

[[tool.importlinter.contracts]]
name = "D-4: agent depends on provider ABCs/manager only, never concrete adapters"
type = "forbidden"
source_modules = ["nova.agent"]
forbidden_modules = ["nova.providers.gemini", "nova.providers.groq"]
