[project]
name = "nova-ai"
version = "0.1.0"
description = "A glass-walled AI assistant that shows you how it thinks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.7,<7",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "import-linter>=2.0",
    # dev console pretty-printing only (TD-11) — never a packaged-build dependency;
    # core.logging import-guards it so production logging works without it.
    "rich>=13.7,<14",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nova"]

# ── ruff (lint + format) ─────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "C4", "S102", "S307"]

[tool.ruff.lint.per-file-ignores]
# Qt overrides (paintEvent, mousePressEvent, ...) must match Qt's camelCase API.
"src/nova/ui/**" = ["N802"]
"tests/**" = ["S101"]

# ── mypy (strict zone: core, agent per AGENTS.md) ────────────────────
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "nova.core.*"
strict = true

# ── pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "live: requires real network/API keys; never run in CI",
    "record: regenerates golden fixtures; run manually with review",
]

[tool.coverage.run]
source = ["src/nova/core"]

# ── import-linter (D-1...D-7, docs/03 §6) ────────────────────────────
# Scoped to what exists at M1: core/ui/app.py. D-2/D-3/D-4 (providers,
# speech, memory, tools, agent) are added as new layers when those
# packages land (M2+) — see docs/03 §6 for the target dependency graph.
[tool.importlinter]
root_packages = ["nova"]

[[tool.importlinter.contracts]]
name = "M1 layering: app -> ui -> core (D-1, D-5, D-6, D-7)"
type = "layers"
layers = [
    "nova.app",
    "nova.ui",
    "nova.core",
]
